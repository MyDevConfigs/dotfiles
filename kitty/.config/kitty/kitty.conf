# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ~/.config/kitty/kitty-themes/01-Wallust.conf

font_family FantasqueSansM Nerd Font Mono
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto
allow_remote_control yes

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

# foreground/background/cursor are set by the active theme

# Shift+Enter inserts a newline instead of submitting, for Claude Code and
# the Copilot CLI.
#
# Enter is CR (0x0D), and Shift cannot modify a control code, so the two are
# the same byte unless the terminal speaks a modern key protocol. kitty has
# one (CSI u); tmux only ever asks for xterm's modifyOtherKeys, which kitty
# parses and deliberately discards with a "superseded by the kitty keyboard
# protocol" warning. So inside tmux there is nothing to negotiate and no
# tmux setting can fix it.
#
# \x1b\r sidesteps the whole problem: it is ESC + CR, the exact bytes
# Ctrl+Alt+M already sends, pure 7-bit ASCII that needs no negotiation and
# passes through tmux untouched. `all` applies it in every keyboard mode
# rather than only the legacy one, so it behaves the same in and out of tmux.
map shift+enter send_text all \x1b\r
