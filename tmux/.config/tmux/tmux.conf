# ══════════════════════════════════════════════════════════════════════════
#  tmux
#
#  Palette is gruvbox, using the same hex values as ~/.config/starship.toml
#  and the lazygit config in this repo, so the prompt, the git TUI and the
#  status bar cannot drift apart.
#
#  Reload:  prefix + r
# ══════════════════════════════════════════════════════════════════════════


# ── Palette ───────────────────────────────────────────────────────────────
# The first ten are lifted verbatim from starship.toml. The last two are
# standard gruvbox and are here because a status bar needs a dark ink for
# text on bright fills, and a muted grey for inactive items.

%hidden BG0=default
%hidden INK=#1d2021
%hidden BG1=#3c3836
%hidden BG3=#665c54
%hidden FG0=#fbf1c7
%hidden MUTED=#a89984
%hidden GRAY=#928374
%hidden RED=#cc241d
%hidden GREEN=#98971a
%hidden YELLOW=#d79921
%hidden BLUE=#458588
%hidden PURPLE=#b16286
%hidden AQUA=#689d6a
%hidden ORANGE=#d65d0e

# Rounded caps, from the Nerd Font powerline-extra range.
%hidden LCAP=
%hidden RCAP=


# ── Terminal ──────────────────────────────────────────────────────────────

set  -g default-terminal "tmux-256color"

# True colour and undercurl. `terminal-features` is the modern form —
# `terminal-overrides` still works but is the pre-3.2 way of saying this.
# usstyle is what lets neovim draw squiggly LSP diagnostics through tmux.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:usstyle"

# ── Extended keys ─────────────────────────────────────────────────────────
#
# Ctrl+Enter and Shift+Enter have no legacy encoding. Enter is CR (0x0D),
# and Ctrl applied to a control code is a no-op, so a terminal speaking the
# original protocol sends the *same byte* for Enter and for Ctrl+Enter.
# Anything that needs to tell them apart — Claude Code and the Copilot CLI
# both read Ctrl+Enter as "insert a newline rather than submit" — depends on
# one of the two modern encodings: xterm's modifyOtherKeys, or CSI u.
#
# Two separate things have to be true, and tmux ships with neither:
#
#   1. tmux has to ask the OUTER terminal to disambiguate, which it only
#      does for a terminal carrying the `extkeys` feature. Its built-in
#      table for `xterm*` predates that feature, and kitty (TERM
#      xterm-kitty) matches the glob and inherits the list without it — so
#      the distinction is destroyed before tmux ever sees the key.
#   2. tmux then has to forward the result to the program in the pane, which
#      `extended-keys off`, the default, does not do.
#
# `on` lets a program request the mode; it is not `always`, which forces it
# on programs that never asked. If something still cannot see Ctrl+Enter,
# `always` is the escalation, and `extended-keys-format csi-u` switches the
# wire format from ^[[27;5;13~ to ^[[13;5u for programs that only parse the
# latter.
#
# To check:  tmux display -p '#{client_termfeatures} #{pane_key_mode}'
# extkeys should be listed, and the mode should no longer read VT10x.

set -as terminal-features ",xterm*:extkeys"
set -s  extended-keys on


# ── Behaviour ─────────────────────────────────────────────────────────────

set  -g prefix C-b                # kept deliberately; see README
bind    C-b send-prefix           # so a nested tmux can still get one

set  -g mouse on
set  -g base-index 1              # windows and panes count from 1, matching
setw -g pane-base-index 1         # the number row on the keyboard
set  -g renumber-windows on       # close window 2 of 3 and 3 becomes 2

# escape-time 0 is not a preference. tmux waits this long to decide whether
# an Escape is a key or the start of an escape sequence, and the default
# 500ms is felt as lag on every <Esc> in neovim.
set -sg escape-time 0

set  -g focus-events on           # lets neovim's autoread and lualine notice
set  -g history-limit 100000
set  -g display-time 2000
set  -g status-interval 5
setw -g mode-keys vi
set  -g set-clipboard on

# Killing the last window of a session normally detaches you entirely.
# This switches to another session instead, which is almost always wanted.
set  -g detach-on-destroy off


# ── Keys ──────────────────────────────────────────────────────────────────

bind r source-file ~/.config/tmux/tmux.conf \; display-message " config reloaded"

# Splits that inherit the current directory. The defaults ("% and \") do not,
# and open in whatever directory the session started in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize, repeatable: hold the prefix once then tap H/J/K/L.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r M-h resize-pane -L 1
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1

bind Space next-layout
bind z resize-pane -Z              # zoom, explicit for discoverability
bind -r "<" swap-window -d -t -1   # move this window left
bind -r ">" swap-window -d -t +1   # and right

# vim-tmux-navigator claims C-l for "move right", which is normally
# clear-screen. This gives it back behind the prefix.
bind C-l send-keys 'C-l'

# Copy mode, vi-style. tmux-yank handles the clipboard itself and detects
# wl-copy on Wayland; these are the selection keys it does not set.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Popups. Floating lazygit over the current pane is the single binding here
# most likely to become muscle memory.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind G display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "$SHELL"


# ══════════════════════════════════════════════════════════════════════════
#  Status bar — design after tmux-dotbar (MIT)
#  https://github.com/vaaleyard/tmux-dotbar
#
#  Reimplemented rather than installed as a plugin, because the readings on
#  the right are not something dotbar does and its status-right is a single
#  configurable string. Colours are gruvbox instead of ayu.
#
#  The design is flat on purpose. No fills, no powerline separators, no
#  pills: every element is plain text on the terminal's own background, and
#  the bar reads as part of the terminal rather than as a widget stuck to it.
#
#  State is carried by COLOUR ALONE:
#
#      inactive window   muted grey
#      current window    bright foreground
#      something wrong   yellow, then red
#
#  There is exactly one fill in the whole bar — the session name while the
#  prefix is held. Because nothing else is ever filled, it is impossible to
#  miss, which is the entire point of spending the effect there.
#
#  Windows are centred with absolute-centre: they stay in the middle of the
#  terminal regardless of how long the left and right content grow.
# ══════════════════════════════════════════════════════════════════════════

set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=#{BG0},fg=#{GRAY}"
set -g status-left-length 120
set -g status-right-length 250

# ── Left: session name, quiet.
#
#    While the prefix is held it becomes the bar's only filled element,
#    capped with rounded glyphs. Style specs inside a #{?...} are split
#    one-per-#[] with no commas — a comma there separates the conditional's
#    branches and tears the spec in half.
set -g status-left "\
#[bg=#{BG0},fg=#{GRAY}]#{?client_prefix,,  #S }\
#[fg=#{ORANGE}]#{?client_prefix,,}\
#[bg=#{ORANGE}]#[fg=#{INK}]#[bold]#{?client_prefix,  #S ,}\
#[bg=#{BG0}]#[fg=#{ORANGE}]#[nobold]#{?client_prefix,,}"

# ── Windows: name only, dot-separated, centred.
#
#    No index, following dotbar. prefix + <n> still switches by number; the
#    number is simply not drawn. The leading glyph comes from the program
#    running in the pane (see app-icon.sh) and inherits the window's colour,
#    so it adds information without adding chrome.
setw -g window-status-separator "#[fg=#{BG3}] • "

setw -g window-status-format "\
#[bg=#{BG0},fg=#{GRAY}]#(~/.config/tmux/scripts/app-icon.sh #{pane_current_command}) #W"

setw -g window-status-current-format "\
#[bg=#{BG0},fg=#{FG0},bold]#(~/.config/tmux/scripts/app-icon.sh #{pane_current_command}) #W\
#[fg=#{BLUE},nobold]#{?window_zoomed_flag, 󰊓,}"

setw -g window-status-bell-style "fg=#{RED},bold"
setw -g window-status-activity-style "fg=#{YELLOW}"

# ── Right: the readings, in the same flat idiom.
#
#    Muted throughout, dot-separated, no fills. battery.sh is the one thing
#    that may introduce colour, and only when a charge is actually low —
#    which keeps colour meaning "attention" everywhere in this bar.
#
#    cpu_percentage / ram_percentage are rewritten into #() calls by
#    tmux-cpu at load. weather.sh is cached; a status bar that blocks on the
#    network freezes the whole client.
# The variable widgets are assembled by one script rather than listed here,
# so a widget that turns out to be empty takes its separator with it. Date
# and time stay in the config: they can never be empty, so they are safe to
# separate inline. See status-right.sh for the reasoning.
set -g status-right "\
#(~/.config/tmux/scripts/status-right.sh)\
#[fg=#{BG3}] • #[fg=#{GRAY}]%a %d %b\
#[fg=#{BG3}] • #[fg=#{FG0}]%H:%M  "

# ── Panes
#
#    Thin borders to match. The border title is switched off whenever a
#    window holds a single pane, because a title bar over the only pane is
#    a wasted row.
set -g pane-border-style "fg=#{BG1}"
set -g pane-active-border-style "fg=#{BG3}"
set -g pane-border-lines single
set -g pane-border-format " #{?pane_active,#[fg=#{FG0}],#[fg=#{BG3}]}#(~/.config/tmux/scripts/app-icon.sh #{pane_current_command}) #{pane_current_command} "

set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
set-hook -g after-split-window    'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'

set -g message-style "bg=#{ORANGE},fg=#{INK},bold"
set -g message-command-style "bg=#{AQUA},fg=#{INK},bold"
setw -g mode-style "bg=#{BG3},fg=#{FG0}"
# display-panes-* take a literal colour, not a format string: %hidden
# substitution does not reach them, so these two are spelled out.
set -g display-panes-active-colour "#d65d0e"
set -g display-panes-colour "#665c54"


# ══════════════════════════════════════════════════════════════════════════
#  Plugins
#
#  Managed by tpm. prefix + I installs, prefix + U updates, prefix + alt-u
#  removes anything no longer listed here.
# ══════════════════════════════════════════════════════════════════════════

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Required
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence. resurrect saves and restores; continuum automates it.
# Together they are the reason a reboot stops costing you your layout.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Clipboard. Detects wl-copy, so this works under Hyprland.
set -g @plugin 'tmux-plugins/tmux-yank'

# Feeds #{cpu_percentage} and #{ram_percentage} to the status bar above.
set -g @plugin 'tmux-plugins/tmux-cpu'

# fzf over sessions, and fzf over everything in the scrollback.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'laktak/extrakto'

# ── Plugin settings

# Restore pane contents too, and let resurrect reopen neovim sessions.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @yank_action 'copy-pipe-and-cancel'

set -g @sessionx-bind 'o'
set -g @sessionx-window-height '70%'
set -g @sessionx-window-width '70%'
set -g @sessionx-zoxide-mode 'on'

set -g @extrakto_key 'tab'
set -g @extrakto_split_direction 'p'   # popup

# which-key ships a default menu and regenerates it on first run.
set -g @tmux-which-key-xdg-enable '1'

# tpm defaults to ~/.tmux/plugins and only discovers an XDG location if it
# is told. Without this, tmux reports "unknown variable:
# TMUX_PLUGIN_MANAGER_PATH" on every load and plugins install to the wrong
# place. The trailing slash matters — tpm concatenates rather than joins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# tpm must be the last line. It is installed by the bootstrap in the README;
# without it tmux still starts, just with none of the above.
run '~/.config/tmux/plugins/tpm/tpm'
